<!doctype html>
<html lang="pl">
  <head>
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var fetchVal = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchVal || origFetch;
            },
            set: function(val) {
              fetchVal = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Fetch polyfill patch error:', e);
        }
      })();
    </script>
