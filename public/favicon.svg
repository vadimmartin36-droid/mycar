<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Metallic Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="70%" stop-color="#0e0d0b"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a1"/>
      <stop offset="35%" stop-color="#f6e05e"/>
      <stop offset="65%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6715"/>
    </linearGradient>

    <!-- Gold Border Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e05e"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#5a420b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Outer Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#ringGrad)" stroke-width="8" opacity="0.8"/>
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>

  <!-- Citroën Luxury Chevrons -->
  <g filter="url(#goldGlow)" transform="translate(0, 10)">
    <!-- Top Chevron -->
    <path d="M 128 220 L 256 120 L 384 220 L 336 248 L 256 182 L 176 248 Z" fill="url(#goldGrad)" />
    <!-- Bottom Chevron -->
    <path d="M 128 320 L 256 220 L 384 320 L 336 348 L 256 282 L 176 348 Z" fill="url(#goldGrad)" />
  </g>
</svg>
